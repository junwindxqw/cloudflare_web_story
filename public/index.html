<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f5f7" />
  <meta name="robots" content="noindex" />
  <title>我的书架 · 书阁</title>
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/shelf.css" />
  <script type="module" src="/js/shelf.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-mini">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <defs>
            <linearGradient id="lg2" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#5a63e8" />
              <stop offset="1" stop-color="#8b5cf6" />
            </linearGradient>
          </defs>
          <rect x="4" y="4" width="40" height="40" rx="12" fill="url(#lg2)" />
          <path d="M24 14.5c-2.8-2-6.5-2.6-10-2v19c3.5-.6 7.2 0 10 2 2.8-2 6.5-2.6 10-2v-19c-3.5-.6-7.2 0-10 2z" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" />
          <path d="M24 14.5v19" stroke="#fff" stroke-width="2.4" />
        </svg>
        <div class="brand-text">
          <strong>书阁</strong>
          <span id="shelf-stats">我的书架</span>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn search-toggle" id="search-toggle" title="搜索" aria-label="搜索">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
        </button>
        <div class="search-box" id="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
          <input id="search-input" class="input" type="search" placeholder="搜索书名或作者" />
          <button class="icon-btn search-close" id="search-close" type="button" aria-label="收起搜索">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <button class="btn" id="upload-btn-top">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14" /></svg>
          导入
        </button>
        <span id="user-chip" hidden>
          <span id="user-email"></span>
          <i id="user-role" hidden>管理员</i>
        </span>
        <button class="icon-btn" id="theme-btn" title="切换深浅主题" aria-label="切换主题">
          <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button class="icon-btn" id="logout-btn" title="退出登录" aria-label="退出登录">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="shelf-main">
    <section id="resume-strip" class="resume-strip" hidden>
      <a id="resume-card" class="resume-card" href="#" aria-label="继续阅读">
        <div class="resume-cover"></div>
        <div class="resume-meta">
          <span class="resume-label">继续阅读</span>
          <strong class="resume-title"></strong>
          <div class="resume-progress"><i></i><span class="resume-pct"></span></div>
        </div>
        <button class="resume-go" type="button" aria-label="继续阅读">
          <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>
        </button>
      </a>
    </section>
    <div id="book-grid" class="book-grid"></div>
    <div id="empty-state" class="empty-state" hidden>
      <svg viewBox="0 0 200 160" aria-hidden="true">
        <rect x="30" y="40" width="60" height="90" rx="6" fill="#5a63e8" opacity="0.85" transform="rotate(-8 60 85)" />
        <rect x="80" y="30" width="60" height="100" rx="6" fill="#8b5cf6" opacity="0.9" />
        <rect x="130" y="45" width="52" height="85" rx="6" fill="#5a63e8" opacity="0.6" transform="rotate(7 156 88)" />
        <circle cx="110" cy="65" r="12" fill="#fff" opacity="0.35" />
        <path d="M95 105h30M95 115h20" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity="0.6" />
      </svg>
      <h2>书架还是空的</h2>
      <p>导入 EPUB / PDF / TXT / MOBI 等格式的电子书，开始阅读之旅</p>
      <button class="btn btn-primary" id="upload-btn-empty">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14" /></svg>
        导入第一本书
      </button>
    </div>
  </main>

  <button class="fab" id="fab-btn" title="导入电子书" aria-label="导入电子书">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14" /></svg>
  </button>
  <input type="file" id="file-input" multiple hidden
    accept=".epub,.pdf,.txt,.mobi,.azw3,.fb2,.cbz,application/epub+zip,application/pdf,text/plain,application/x-mobipocket-ebook" />

  <!-- 上传队列 -->
  <div id="upload-panel" hidden>
    <div class="upload-head">
      <strong>导入进度</strong>
      <button class="icon-btn" id="upload-close" title="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div id="upload-list"></div>
  </div>

  <!-- 书籍操作菜单 -->
  <div id="menu-mask" hidden></div>
  <div id="book-menu" class="context-menu" hidden></div>
</body>
</html>
